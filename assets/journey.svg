<svg width="1200" height="210" viewBox="0 0 1200 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline from NSUT in 2023 to Texas Instruments and Mudrakala in 2026">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14090F"/><stop offset="0.5" stop-color="#1F0D19"/><stop offset="1" stop-color="#120610"/>
    </linearGradient>
