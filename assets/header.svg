<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Diya Joshi — Data Analysis, Embedded Systems, Applied AI, Product</title>
  <desc id="desc">A dark terminal-style banner with a signal waveform and circuit-trace motif and Diya Joshi's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0712"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#08141C"/>
    </linearGradient>
    <linearGradient id="accent" x1="84" y1="150" x2="620" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D2A8FF"/>
      <stop offset="1" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="wave" x1="840" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D2A8FF"/>
      <stop offset="1" stop-color="#79C0FF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#A371F7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#30363D" stroke-opacity="0.28"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="980" cy="190" rx="300" ry="260" fill="url(#glow)"/>

    <rect x="34" y="30" width="1132" height="300" rx="16" fill="#0D1117" fill-opacity="0.72" stroke="#30363D"/>
    <circle cx="64" cy="58" r="6" fill="#F85149"/>
    <circle cx="84" cy="58" r="6" fill="#D29922"/>
    <circle cx="104" cy="58" r="6" fill="#3FB950"/>
    <text x="600" y="63" fill="#8B949E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">diya@github — ~/measure/then/ship</text>
    <path d="M34 82H1166" stroke="#30363D"/>

    <text x="86" y="133" fill="#D2A8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$ whoami</text>
    <text x="84" y="205" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">DIYA JOSHI</text>
    <text x="88" y="247" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">DATA ANALYSIS · EMBEDDED SYSTEMS · APPLIED AI · PRODUCT</text>
    <text x="88" y="291" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">from raw signal to shipped decision, with the numbers to prove it <tspan fill="#D2A8FF">█</tspan></text>

    <!-- circuit traces -->
    <g stroke="#79C0FF" stroke-opacity="0.42" stroke-width="1.5" fill="none">
      <path d="M868 118H930L958 146H1040L1068 118H1128"/>
      <path d="M868 262H918L946 234H1050L1078 262H1128"/>
      <path d="M958 146V234"/>
      <path d="M1040 146V234"/>
    </g>
    <g fill="#0D1117" stroke="#D2A8FF" stroke-width="2" filter="url(#softGlow)">
      <circle cx="868" cy="118" r="6"/><circle cx="1128" cy="118" r="6"/>
      <circle cx="868" cy="262" r="6"/><circle cx="1128" cy="262" r="6"/>
      <rect x="951" y="139" width="14" height="14" rx="2"/>
      <rect x="1033" y="139" width="14" height="14" rx="2"/>
      <rect x="951" y="227" width="14" height="14" rx="2"/>
      <rect x="1033" y="227" width="14" height="14" rx="2"/>
    </g>

    <!-- signal waveform through the middle -->
    <path d="M846 190 H886 L896 176 L906 204 L916 168 L926 212 L936 182 L946 198 L958 190 H1004 L1012 158 L1020 222 L1028 174 L1036 206 L1046 190 H1080 L1088 184 L1096 196 L1104 188 L1112 192 L1120 190 H1150"
          stroke="url(#wave)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>
    <text x="1150" y="182" fill="#8B949E" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">i2c · 400 kHz</text>
  </g>
</svg>
