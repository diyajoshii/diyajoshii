name: contribution snake

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238250df&color_dots=%23ebedf0,%23e2d4ff,%23c297ff,%239e6dff,%238250df
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23d2a8ff&color_dots=%23161b22,%232d1b69,%235a32a3,%238957e5,%23d2a8ff

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
